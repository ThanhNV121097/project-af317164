<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hello-word-6</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    main {
      text-align: center;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 400;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main aria-label="Hello Word display">
    <h1>Hello Word</h1>
  </main>
</body>
</html>
